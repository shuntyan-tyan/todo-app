<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoアプリ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <h1>📝 ToDoリスト</h1>

    <!-- 🔔 通知許可ボタン -->
    <button id="notificationBtn" onclick="requestNotificationPermission()">🔔 通知をオンにする</button>

    <!-- 📝 タスク入力エリア -->
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="やることを入力">
      <input type="datetime-local" id="timeInput">
      <button id="addBtn" onclick="addTask()">追加</button>
    </div>

    <!-- 📋 タスク一覧 -->
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
