<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoアプリ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <h1>📝 ToDoリスト</h1>

    <!-- 🔔 通知許可ボタン -->
    <button id="notificationBtn" onclick="requestNotificationPermission()">
      🔔 まずタップして「通知をオン」にする
    </button>

    <!-- 📝 タスク入力エリア -->
    <div class="input-group">
      <label for="taskInput">やることを入力：</label>
      <input type="text" id="taskInput" placeholder="例：買い物に行く">
      
      <label for="timeInput">通知する日時：</label>
      <input type="datetime-local" id="timeInput">
      
      <button id="addBtn" onclick="addTask()">➕ タスクを追加して通知予約</button>
    </div>

    <h2>📋 セットしたタスク一覧</h2>
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
